<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notas Corner | Tus notas, organizadas y tuyas</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/landing.css">
    <link rel="icon" type="image/png" href="../happyfavicon.png">
</head>
<body>

    <!-- HEADER -->
    <header>
        <a href="/notas-corner/" class="logo">
            <i class="fa-solid fa-graduation-cap" style="color: var(--hp-pink); font-size: 24px;"></i> 
            <span style="font-weight: 900; font-size: 20px;">Notas Corner</span>
        </a>
        <div style="display:flex; align-items:center; gap:10px;">
            <button class="theme-toggle" id="theme-toggle" title="Night Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- HERO SECTION -->
    <main class="hero-container">
        <div class="hero-content">
            <div class="hero-icon">
                <i class="fa-solid fa-book-bookmark"></i>
            </div>
            <h1 class="page-title" style="margin-top: 20px; font-size: 42px;">Notas Corner</h1>
            <p class="hero-subtitle">Tus notas, organizadas y tuyas</p>
            
            <ul class="benefits-list">
                <li><i class="fa-solid fa-check" style="color: var(--hp-pink);"></i> Carga ultra rápida</li>
                <li><i class="fa-solid fa-check" style="color: var(--hp-orange);"></i> Funciona sin conexión</li>
                <li><i class="fa-solid fa-check" style="color: var(--hp-pink);"></i> Privacidad garantizada</li>
            </ul>

            <div class="hero-actions">
                <button class="btn-primary btn-add" style="font-size: 16px; padding: 15px;" onclick="window.notasAppAuth.openAuthModal('login')">
                    Iniciar Sesión
                </button>
                <button class="btn-secondary" style="font-size: 16px; padding: 15px; width: 100%;" onclick="window.notasAppAuth.openAuthModal('register')">
                    Crear Cuenta
                </button>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer-admin">
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 10px;">Parte del ecosistema Happy Corner</p>
        <a href="https://happycorner.top" target="_blank">Volver a la tienda principal</a>
    </footer>

    <!-- AUTH MODAL -->
    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <span class="modal-close" onclick="window.notasAppAuth.closeAuthModal()"><i class="fa-solid fa-xmark"></i></span>
            
            <h2 id="auth-title" style="margin-bottom: 25px; font-weight: 900;">Iniciar Sesión</h2>
            
            <form id="auth-form" onsubmit="window.notasAppAuth.handleAuthSubmit(event)">
                <label class="input-label">Correo electrónico</label>
                <input type="email" id="auth-email" class="input-text" placeholder="tu@correo.com" required>
                
                <label class="input-label">Contraseña</label>
                <input type="password" id="auth-password" class="input-text" placeholder="Mínimo 6 caracteres" minlength="6" required>
                
                <p id="auth-error" style="color: var(--error); font-size: 13px; margin-bottom: 15px; display: none;"></p>
                
                <button type="submit" id="auth-submit-btn" class="btn-add">Continuar</button>
            </form>
            
            <div style="text-align: center; margin: 20px 0;">
                <span style="color: var(--text-muted); font-size: 13px;">O</span>
            </div>
            
            <button class="btn-secondary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;" onclick="window.notasAppAuth.handleGoogleLogin()">
                <i class="fa-brands fa-google"></i> Continuar con Google
            </button>
            
            <div style="margin-top: 25px; text-align: center; font-size: 13px;">
                <a href="#" id="auth-switch-link" style="color: var(--hp-pink); text-decoration: none; font-weight: 700;">¿No tienes cuenta? Crear una</a>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
