<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HappyNotas — Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles/dashboard.css">
    <link rel="icon" type="image/png" href="../happyfavicon.png">
    <style>
        .nav-icon {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 18px;
            width: 36px; height: 36px;
            border-radius: 10px;
            background: var(--input-bg);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .nav-icon:hover { color: var(--hp-pink); background: rgba(255,82,153,0.1); }
        .user-avatar {
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .user-avatar:hover { color: var(--hp-pink); }
        body { padding-bottom: 0; }
        main.dashboard-container { padding-bottom: 60px; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <a href="/notas-corner/dashboard" class="logo-area" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
            <img src="../happylogo.png" alt="HappyNotas" style="height:32px;width:auto;">
            <span style="font-weight:900;font-size:18px;color:var(--text-color);">Happy<span style="color:var(--hp-pink);">Notas</span></span>
        </a>
        <div style="display:flex; align-items:center; gap:10px;">
            <button class="theme-toggle" id="theme-toggle" title="Night Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
            <a href="/notas-corner/settings" class="nav-icon" title="Configuración">
                <i class="fa-solid fa-gear"></i>
            </a>
            <div class="user-avatar" id="header-avatar">
                <i class="fa-solid fa-circle-user"></i>
            </div>
            <div class="menu-btn" id="menuBtn">
                <span></span><span></span><span></span>
            </div>
        </div>
    </header>

    <!-- SIDE MENU -->
    <div class="overlay" id="overlay"></div>
    <nav class="side-menu" id="sideMenu">
        <a href="/notas-corner/dashboard"><i class="fa-solid fa-house"></i> Inicio</a>
        <a href="/notas-corner/settings"><i class="fa-solid fa-gear"></i> Configuración</a>
        <a href="#" id="menu-logout" style="color: var(--error);"><i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar Sesión</a>
    </nav>

    <!-- MAIN DASHBOARD -->
    <main class="dashboard-container">
        
        <div class="welcome-section">
            <h1 class="page-title" style="margin: 0; text-align: left; font-size: 32px;" id="welcome-title">Cargando...</h1>
            <p class="hero-subtitle" style="margin-bottom: 20px; text-align: left;">¿Qué deseas hacer hoy?</p>
            
            <div class="actions-row">
                <button class="btn-primary btn-add" style="flex: 1;" onclick="window.notasAppDashboard.openNoteEditor()">
                    <i class="fa-solid fa-plus"></i> Nueva Nota
                </button>
                <button class="btn-secondary" style="flex: 1;" onclick="document.getElementById('import-file').click()">
                    <i class="fa-solid fa-file-import"></i> Importar .happyc
                </button>
                <input type="file" id="import-file" accept=".happyc,.json" style="display: none;" onchange="window.notasAppDashboard.importNotes(event)">
            </div>
        </div>

        <div class="search-bar-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="search-input" class="input-text" placeholder="Buscar notas por título..." style="margin-bottom: 0; padding-left: 40px;" oninput="window.notasAppDashboard.filterNotes()">
        </div>

        <!-- TABS -->
        <div class="tabs-container">
            <button class="tab-btn active" onclick="window.notasAppDashboard.switchTab('mine')">Mis Notas</button>
        </div>

        <!-- NOTES GRID -->
        <div class="grid" id="notes-grid" style="padding: 0; margin-top: 20px;">
            <!-- Notas se renderizan aquí -->
            <div style="grid-column: 1 / -1; text-align: center; padding: 40px;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 30px; color: var(--hp-pink);"></i>
            </div>
        </div>

    </main>

    <!-- NOTE EDITOR MODAL -->
    <div class="modal" id="editor-modal">
        <div class="modal-content" style="max-width: 600px; width: 95%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <input type="text" id="note-title" class="note-title-input" placeholder="Título de la nota" required>
                <span class="modal-close" onclick="window.notasAppDashboard.closeNoteEditor()"><i class="fa-solid fa-xmark"></i></span>
            </div>
            
            <textarea id="note-content" class="note-content-input" placeholder="Escribe aquí tu nota..."></textarea>
            
            <input type="hidden" id="note-id">
            
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
                <button class="btn-secondary" onclick="window.notasAppDashboard.closeNoteEditor()">Cancelar</button>
                <button class="btn-primary btn-add" id="save-note-btn" style="width: auto; padding: 12px 25px;" onclick="window.notasAppDashboard.saveNote()">Guardar Nota</button>
            </div>
        </div>
    </div>

    <!-- SHARE MODAL -->
    <div class="modal" id="share-modal">
        <div class="modal-content">
            <span class="modal-close" onclick="window.notasAppDashboard.closeShareModal()"><i class="fa-solid fa-xmark"></i></span>
            <h2 style="margin-bottom: 15px;">Compartir Nota</h2>
            
            <div id="share-content">
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 15px;">
                    Crea un enlace público para que cualquiera con el enlace pueda leer esta nota.
                </p>
                <button class="btn-primary btn-add" id="generate-link-btn" onclick="window.notasAppDashboard.generateShareLink()">Generar enlace público</button>
            </div>
            
            <div id="share-link-container" style="display: none; margin-top: 15px;">
                <label class="input-label">Enlace público de lectura:</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="share-link-input" class="input-text" style="margin-bottom: 0;" readonly>
                    <button class="btn-secondary" onclick="window.notasAppDashboard.copyShareLink()"><i class="fa-regular fa-copy"></i> Copiar</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
