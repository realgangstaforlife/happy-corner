<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - HappyNotas</title>
    <!-- By default we load red, but user can change it later -->
    <link rel="stylesheet" href="styles-red.css" id="theme-stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="../happyfavicon.png">
    <style>
        .emoji-picker { font-size: 24px; cursor: pointer; padding: 10px; background: var(--input-bg); border-radius: 12px; display: inline-block; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 2000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--surface-color); padding: 30px; border-radius: 28px; width: 90%; max-width: 400px; box-shadow: var(--shadow-lg); }
        .subject-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        
        .subject-card { text-align: center; cursor: pointer; position: relative; }
        .subject-card .emoji { font-size: 40px; margin-bottom: 10px; }
        .subject-card .delete-btn { position: absolute; top: -10px; right: -10px; background: #ff4d4d; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 14px; opacity: 0; transition: 0.3s; }
        .subject-card:hover .delete-btn { opacity: 1; }
        
        .timer-warning { display: none; color: var(--hp-orange); font-size: 13px; font-weight: bold; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">
        <i class="fa-solid fa-graduation-cap"></i> <span>HappyNotas</span>
    </a>
    <div style="display: flex; gap: 10px; align-items: center;">
        <span id="userGreeting" style="font-weight: 700; font-size: 14px;"></span>
        <button id="btnSettings" class="btn-secondary" style="padding: 8px 12px; border-radius: 12px; font-size: 14px;"><i class="fa-solid fa-gear"></i></button>
        <button id="btnExport" class="btn-primary" style="padding: 8px 12px; border-radius: 12px; font-size: 14px;"><i class="fa-solid fa-download"></i></button>
    </div>
</header>

<div class="container mt-4">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-size: 28px;">Tus Materias</h2>
        <button id="btnAddSubject" class="btn-primary"><i class="fa-solid fa-plus"></i> Nueva</button>
    </div>
    
    <div class="subject-grid" id="subjectsContainer">
        <!-- Subjects will be injected here -->
    </div>
</div>

<!-- Add Subject Modal -->
<div class="modal" id="subjectModal">
    <div class="modal-content">
        <h3 style="margin-bottom: 20px;">Nueva Materia</h3>
        <label class="input-label">Emoji Representativo</label>
        <div style="text-align: center; margin-bottom: 15px;">
            <input type="text" id="subEmoji" class="input-text text-center" value="📚" style="font-size: 30px; padding: 10px; width: 80px;" maxlength="2">
        </div>
        <label class="input-label">Nombre de la Materia</label>
        <input type="text" id="subName" class="input-text" placeholder="Ej. Matemáticas" style="margin-bottom: 20px;">
        
        <div style="display: flex; gap: 10px;">
            <button class="btn-secondary" id="btnCancelSub" style="flex:1;">Cancelar</button>
            <button class="btn-primary" id="btnSaveSub" style="flex:1;">Guardar</button>
        </div>
    </div>
</div>

<!-- Global Settings Modal -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        <h3 style="margin-bottom: 10px;"><i class="fa-solid fa-sliders"></i> Ajustes de Calificación</h3>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Configura los porcentajes globales. El total debe ser 100%.</p>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <label style="font-weight: bold; width: 60%;">Saber (Cognitivo)</label>
            <input type="number" id="percSaber" class="input-text text-center" value="50" style="width: 35%; padding: 10px;">
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <label style="font-weight: bold; width: 60%;">Hacer (Procedimental)</label>
            <input type="number" id="percHacer" class="input-text text-center" value="40" style="width: 35%; padding: 10px;">
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <label style="font-weight: bold; width: 60%;">Ser (Actitudinal)</label>
            <input type="number" id="percSer" class="input-text text-center" value="10" style="width: 35%; padding: 10px;">
        </div>
        
        <div style="background: var(--input-bg); padding: 15px; border-radius: 14px; text-align: center; font-weight: 900; margin-bottom: 15px;" id="totalPercentageBox">
            Total: <span id="totalPercentage">100</span>%
        </div>
        
        <div id="warningMsg" class="timer-warning">
            <i class="fa-solid fa-triangle-exclamation"></i> ¡El total no suma 100%! Espera <span id="timerCount">10</span>s para confirmar bajo tu propio riesgo.
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn-secondary" id="btnCancelSettings" style="flex:1;">Cancelar</button>
            <button class="btn-primary" id="btnSaveSettings" style="flex:1;">Guardar</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
